<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Messenger for Linux</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-700 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-10 max-w-md w-full text-center">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">Messenger for Linux</h1>
    <p class="text-gray-500 mb-8">Portable AppImage &mdash; no installation required</p>

    <div class="bg-gray-50 rounded-xl p-4 mb-8 text-sm text-gray-600">
      <p>Filename: <span class="font-semibold text-gray-800">Messenger-x86_64.AppImage</span></p>
      <p class="mt-1">Size: <span class="font-semibold text-gray-800">11 MB</span></p>
    </div>

    <a href="Messenger-x86_64.AppImage" download
       class="inline-block bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold px-12 py-4 rounded-xl hover:from-indigo-600 hover:to-purple-700 transition transform hover:-translate-y-0.5 hover:shadow-lg">
      Download AppImage
    </a>

    <p class="mt-8 text-xs text-gray-400">
      Download, run <code class="bg-gray-100 px-1 rounded">chmod +x Messenger-x86_64.AppImage</code>, then double-click.
    </p>
  </div>
</body>
</html>
