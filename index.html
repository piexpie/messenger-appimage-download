<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Messenger for Linux</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-700 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-10 max-w-md w-full text-center">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">Messenger for Linux</h1>
    <p class="text-gray-500 mb-8">Portable AppImage &mdash; no installation required</p>

    <div class="bg-gray-50 rounded-xl p-4 mb-8 text-sm text-gray-600">
      <p>Filename: <span class="font-semibold text-gray-800">Messenger-x86_64.AppImage</span></p>
      <p class="mt-1">Size: <span class="font-semibold text-gray-800">11 MB</span></p>
    </div>

    <a href="Messenger-x86_64.AppImage" download
       class="inline-block bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold px-12 py-4 rounded-xl hover:from-indigo-600 hover:to-purple-700 transition transform hover:-translate-y-0.5 hover:shadow-lg">
      Download AppImage
    </a>

    <div class="mt-8 border-t border-gray-200 pt-6">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Install via wget</p>
      <div class="relative bg-gray-900 text-green-400 rounded-xl text-left text-xs font-mono overflow-hidden">
        <div class="flex items-center justify-between px-4 py-3">
          <code class="text-yellow-300">wget -qO- https://work-message.onrender.com/install.sh | bash</code>
          <button onclick="navigator.clipboard.writeText('wget -qO- https://work-message.onrender.com/install.sh | bash').then(()=>{this.textContent='Copied!';setTimeout(()=>{this.textContent='Copy'},2000)})"
                  class="ml-4 shrink-0 bg-gray-700 hover:bg-gray-600 text-white text-xs px-3 py-1.5 rounded-lg transition whitespace-nowrap">
            Copy
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
